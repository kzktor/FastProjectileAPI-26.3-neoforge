plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':l2serial')
    implementation project(':l2core')
    implementation project(':registrate')

    compileOnly 'mezz.jei:jei-26.3-neoforge-api:31.9.0.56'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

// The mods.toml in src/main/resources carries ${} placeholders; expand them at build time.
// (This module's toml lives in resources/, not templates/, so generateModMetadata doesn't apply.)
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version,
            neo_version_range   : neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}
